name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No module cache: a release builds only from the tagged source and go.sum.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test -race -count=1 ./...
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}" arch="${target#*/}"
            name="renvoy_${VERSION#v}_${os}_${arch}"
            ext=""
            [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/amitpatole/renvoy/internal/app.Version=${VERSION}" \
              -o "build/$name/renvoy$ext" ./cmd/renvoy
            cp LICENSE README.md CHANGELOG.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign checksums with Sigstore (keyless)
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v v="${VERSION#v}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && (/^## \[/ || /^\[[^]]*\]: /) { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$VERSION" dist/* --title "Renvoy $VERSION" --notes-file notes.md --verify-tag
